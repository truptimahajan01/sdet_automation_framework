[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = --html=reports/report.html --self-contained-html -v
asyncio_mode = auto
markers =
    smoke: Quick sanity checks (run on every deployment)
    regression: Full regression suite
    api: API-only tests (no browser required)
    ui: Browser-based Selenium tests